name: Start published release builds

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dispatch:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch cacheable release builds on main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: "slicer-release-build",
              client_payload: {
                release_tag: context.payload.release.tag_name,
                request_id: `${context.runId}.${process.env.GITHUB_RUN_ATTEMPT}`
              }
            });
            await core.summary
              .addHeading("Release builds started")
              .addLink("Watch builds and download publishing", `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/build-release.yml`)
              .addRaw("\nBuilds use the release tag; caches are shared on main.\n")
              .write();
