[package]
name = "slicer"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A native video trimming toolbox with bundled FFmpeg"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:rfd", "dep:image"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
libloading = "0.8.9"
raw-window-handle = "0.6.2"
gpui-kit = { version = "=0.6.1", optional = true }
rfd = { version = "0.15.4", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"

[dev-dependencies]
tempfile = "3"
gif = "0.13"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
