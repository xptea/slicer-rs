[package]
name = "slicer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native video trimming toolbox with bundled FFmpeg"

[features]
default = ["desktop"]
ui-tests = ["desktop", "gpui-kit/test-support"]
desktop = ["dep:gpui-kit", "dep:rfd", "dep:image", "dep:cosmic-text"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8.9"
raw-window-handle = "0.6.2"
gpui-kit = { version = "=0.6.1", optional = true }
rfd = { version = "0.15.4", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"], optional = true }
cosmic-text = { version = "0.19.0", optional = true }

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["shape"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

[[example]]
name = "editor_engine_check"
required-features = ["desktop"]

[[example]]
name = "clip_switch_check"
required-features = ["desktop"]

[[example]]
name = "scrub_check"
required-features = ["desktop"]

[[example]]
name = "scrub_visual_check"
required-features = ["desktop"]

[[example]]
name = "pause_check"
required-features = ["desktop"]
